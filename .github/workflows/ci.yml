name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: shell 语法
        run: |
          bash -n install.sh
          bash -n scripts/preflight.sh

      - name: 安装依赖（含 dev）
        run: |
          python -m venv .venv
          ./.venv/bin/python -m pip install --quiet --upgrade pip
          ./.venv/bin/python -m pip install --quiet -r requirements.txt -r requirements-dev.txt

      - name: 静态检查（ruff）
        run: ./.venv/bin/ruff check .

      - name: 静态检查（JSON / TOML / SVG）
        run: |
          python - <<'PY'
          import glob, json, pathlib, tomllib
          import xml.etree.ElementTree as ET

          files = (glob.glob("examples/*.json")
                   + glob.glob("dsh-bundle/locale/*.json")
                   + ["dsh-bundle/package.json"])
          for f in files:
              json.load(open(f, encoding="utf-8"))
          tomllib.load(open("examples/codex.config.toml", "rb"))
          ET.parse("dsh-bundle/icon.svg")
          print(f"JSON/TOML/SVG 检查通过：{len(files)} 个 JSON")
          PY

      - name: 单元测试
        run: ./.venv/bin/python scripts/unit_tests.py

      - name: MCP 协议冒烟测试
        run: ./.venv/bin/python scripts/smoke_test.py

      - name: 安装器深测（临时 HOME，5 种形态）
        run: ./.venv/bin/python scripts/installer_test.py

      - name: 发布前自检（含 ruff / 单测 / 握手 / 敏感信息）
        run: ./scripts/preflight.sh
