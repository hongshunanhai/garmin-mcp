# ⚠️ 安装前请把下面三处路径改成你本机的实际绝对路径
- insert:
    - id: mcp-garmin
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: garmin
        transport: stdio
        command: /绝对路径/garmin-mcp/.venv/bin/python
        args:
          - /绝对路径/garmin-mcp/garmin_mcp.py
        cwd: /绝对路径/garmin-mcp
        failOnStartupError: false
        toolCallTimeoutMs: 600000
